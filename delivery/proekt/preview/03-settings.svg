<text x="114.0" y="95.5" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">SFN Logs</text>
<text x="87.4" y="164.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Журнал</text>
<text x="93.2" y="212.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Поиск</text>
<text x="70.2" y="260.8" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">Настройки</text>
<text x="71.1" y="308.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">О скрипте</text>
<text x="60.0" y="1060.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">v2.2.2</text>
<text x="60.0" y="1078.5" fill="#33d872" opacity="1.000" font-size="13.5" xml:space="preserve">Данные: ок</text>
<text x="220.0" y="85.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">Настройки</text>
<text x="220.0" y="119.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">Окно</text>
<text x="214.0" y="154.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Горячая клавиша:</text>
<text x="400.0" y="154.5" fill="#b82d43" opacity="1.000" font-size="13.5" xml:space="preserve">F10</text>
<text x="238.0" y="183.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Показывать уволенных в журнале</text>
<text x="220.0" y="207.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">Состав из игры</text>
<text x="238.0" y="241.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Забирать состав из ответа /members</text>
<text x="220.0" y="263.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   кнопка ниже отправляет /members, а скрипт разбирает ответ сервера:</text>
<text x="220.0" y="288.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   сотрудники попадают в журнал, ранги и даты добираются из Evolve Logs</text>
<text x="218.0" y="318.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">последний состав</text>
<text x="833.5" y="318.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">ещё не запрашивали</text>
<text x="226.0" y="350.5" fill="#888888" opacity="1.000" font-size="13.5" xml:space="preserve"> ОБНОВИТЬ СОСТАВ ИЗ ИГРЫ</text>
<text x="220.0" y="393.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">Данные из Evolve Logs</text>
<text x="218.0" y="428.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">данные запрашиваются от имени</text>
<text x="726.0" y="428.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">ваш ник (подставится в игре)</text>
<text x="220.0" y="455.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   журнал Evolve RP отдаёт данные только по нику игрока; если состав</text>
<text x="220.0" y="480.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   не обновляется - зайдите в игру и нажмите «Обновить данные всех»</text>
<text x="218.0" y="510.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">соединение</text>
<text x="990.9" y="510.5" fill="#33d872" opacity="1.000" font-size="13.5" xml:space="preserve">есть</text>
<text x="226.0" y="542.5" fill="#888888" opacity="1.000" font-size="13.5" xml:space="preserve">R ОБНОВИТЬ ДАННЫЕ ВСЕХ</text>
<text x="226.0" y="588.5" fill="#888888" opacity="1.000" font-size="13.5" xml:space="preserve">СОХРАНИТЬ ЖУРНАЛ</text>
<text x="226.0" y="634.5" fill="#888888" opacity="1.000" font-size="13.5" xml:space="preserve">ВЫГРУЗИТЬ В ФАЙЛ</text>
<text x="220.0" y="677.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">Обновления</text>
<text x="238.0" y="711.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Проверять обновления автоматически</text>
<text x="238.0" y="737.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Ставить новую версию сразу</text>
<text x="220.0" y="759.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   скрипт сам берёт свежую версию из репозитория и подменяет свой файл;</text>
<text x="220.0" y="784.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   старая версия сохраняется рядом как SFNLogs.lua.bak</text>
<text x="218.0" y="814.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">обновлений</text>
<text x="1002.4" y="814.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">нет</text>
<text x="218.0" y="846.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">последняя проверка</text>
<text x="856.5" y="846.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">ещё не проверяли</text>
<text x="226.0" y="878.5" fill="#888888" opacity="1.000" font-size="13.5" xml:space="preserve">R ПРОВЕРИТЬ ОБНОВЛЕНИЯ</text>
<text x="220.0" y="921.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">Служебное</text>
<text x="220.0" y="951.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   файл настроек: /tmp/sfntest_ui\SFNLogs\config.ini</text>
<text x="226.0" y="981.5" fill="#888888" opacity="1.000" font-size="13.5" xml:space="preserve">ПЕРЕЧИТАТЬ config.ini</text>
</svg>