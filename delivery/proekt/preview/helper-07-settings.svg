<text x="114.0" y="95.5" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">SFN Helper</text>
<text x="95.4" y="164.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Журнал</text>
<text x="101.2" y="212.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Поиск</text>
<text x="107.0" y="260.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Фото</text>
<text x="107.0" y="308.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Эфир</text>
<text x="83.9" y="356.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Соцопрос</text>
<text x="78.2" y="404.8" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">Настройки</text>
<text x="79.1" y="452.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">О скрипте</text>
<text x="60.0" y="1775.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">v0.3.2</text>
<text x="60.0" y="1793.5" fill="#33d872" opacity="1.000" font-size="13.5" xml:space="preserve">Данные: ок</text>
<text x="236.0" y="85.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">Настройки</text>
<text x="236.0" y="119.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">Окно</text>
<text x="230.0" y="154.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Горячая клавиша:</text>
<text x="416.0" y="154.5" fill="#b82d43" opacity="1.000" font-size="13.5" xml:space="preserve">F9</text>
<text x="254.0" y="183.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Показывать уволенных в журнале</text>
<text x="236.0" y="207.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">Состав из игры</text>
<text x="254.0" y="241.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Забирать состав из ответа /members</text>
<text x="236.0" y="263.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   кнопка ниже отправляет /members, а скрипт разбирает ответ сервера:</text>
<text x="236.0" y="288.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   сотрудники попадают в журнал, ранги и даты добираются из Evolve Logs</text>
<text x="234.0" y="318.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">последний состав</text>
<text x="857.2" y="318.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">ещё не запрашивали</text>
<text x="242.0" y="350.5" fill="#888888" opacity="1.000" font-size="13.5" xml:space="preserve"> ОБНОВИТЬ СОСТАВ ИЗ ИГРЫ</text>
<text x="236.0" y="393.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">Данные из Evolve Logs</text>
<text x="234.0" y="428.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">данные запрашиваются от имени</text>
<text x="749.7" y="428.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">ваш ник (подставится в игре)</text>
<text x="236.0" y="455.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   журнал Evolve RP отдаёт данные только по нику игрока; если состав</text>
<text x="236.0" y="480.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   не обновляется - зайдите в игру и нажмите «Обновить данные всех»</text>
<text x="234.0" y="510.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">соединение</text>
<text x="1014.7" y="510.5" fill="#33d872" opacity="1.000" font-size="13.5" xml:space="preserve">есть</text>
<text x="242.0" y="542.5" fill="#888888" opacity="1.000" font-size="13.5" xml:space="preserve">R ОБНОВИТЬ ДАННЫЕ ВСЕХ</text>
<text x="242.0" y="588.5" fill="#888888" opacity="1.000" font-size="13.5" xml:space="preserve">СОХРАНИТЬ ЖУРНАЛ</text>
<text x="242.0" y="634.5" fill="#888888" opacity="1.000" font-size="13.5" xml:space="preserve">ВЫГРУЗИТЬ В ФАЙЛ</text>
<text x="236.0" y="677.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">Обновления</text>
<text x="254.0" y="711.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Проверять обновления автоматически</text>
<text x="254.0" y="737.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Ставить новую версию сразу</text>
<text x="236.0" y="759.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   скрипт сам берёт свежую версию из репозитория и подменяет свой файл;</text>
<text x="236.0" y="784.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   старая версия сохраняется рядом как SFNLogs.lua.bak</text>
<text x="234.0" y="814.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">обновлений</text>
<text x="1026.2" y="814.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">нет</text>
<text x="234.0" y="846.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">последняя проверка</text>
<text x="880.3" y="846.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">ещё не проверяли</text>
<text x="242.0" y="878.5" fill="#888888" opacity="1.000" font-size="13.5" xml:space="preserve">R ПРОВЕРИТЬ ОБНОВЛЕНИЯ</text>
<text x="236.0" y="921.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">Фото</text>
<text x="234.0" y="956.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">лимит игроков в неделю</text>
<text x="1041.6" y="956.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">25</text>
<text x="234.0" y="988.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">лимит мест в неделю</text>
<text x="1041.6" y="988.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">15</text>
<text x="234.0" y="1020.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">снято на этой неделе</text>
<text x="1012.8" y="1020.5" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">3 + 2</text>
<text x="236.0" y="1047.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   база: /tmp/sfntest_ui\sfn_photo_data\photos.json</text>
<text x="236.0" y="1072.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   окно открывается само, когда сервер показывает заказ-диалог папарацци</text>
<text x="236.0" y="1099.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">Эфир</text>
<text x="234.0" y="1134.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">доступ</text>
<text x="968.6" y="1134.5" fill="#33d872" opacity="1.000" font-size="13.5" xml:space="preserve">разрешён</text>
<text x="234.0" y="1166.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">хоткей вкладки</text>
<text x="1032.0" y="1166.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">F11</text>
<text x="234.0" y="1198.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">максимум баллов</text>
<text x="1041.6" y="1198.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">20</text>
<text x="234.0" y="1230.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">призовой фонд</text>
<text x="993.6" y="1230.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">500000$</text>
<text x="234.0" y="1262.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">ставка за минуту</text>
<text x="1012.8" y="1262.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">6000$</text>
<text x="236.0" y="1289.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">   база баллов и тексты речей: /tmp/sfntest_ui\sfn_data</text>
<text x="236.0" y="1316.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">Соцопрос</text>
<text x="234.0" y="1351.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">цикл</text>
<text x="982.0" y="1351.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">не идёт</text>
<text x="234.0" y="1383.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">хоткей вкладки</text>
<text x="1032.0" y="1383.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">F10</text>
<text x="234.0" y="1415.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">опрошено</text>
<text x="993.6" y="1415.5" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">3 / 100</text>
<text x="234.0" y="1447.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">выдано листовок</text>
<text x="993.6" y="1447.5" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">2 / 100</text>
<text x="234.0" y="1479.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">полов в общей базе</text>
