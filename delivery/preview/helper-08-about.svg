<line x1="1033.5" y1="45.5" x2="1042.5" y2="52.5" stroke="#5b6b77" stroke-opacity="1.000" stroke-width="1.6"/>
<line x1="1042.5" y1="45.5" x2="1033.5" y2="52.5" stroke="#5b6b77" stroke-opacity="1.000" stroke-width="1.6"/>
<text x="114.0" y="95.5" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">SFN Helper</text>
<text x="95.4" y="164.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Журнал</text>
<text x="101.2" y="212.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Поиск</text>
<text x="107.0" y="260.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Фото</text>
<text x="107.0" y="308.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Эфир</text>
<text x="83.9" y="356.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Соцопрос</text>
<text x="78.2" y="404.8" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">Настройки</text>
<text x="79.1" y="452.8" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">О скрипте</text>
<text x="60.0" y="521.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">v0.3.1</text>
<text x="60.0" y="539.5" fill="#33d872" opacity="1.000" font-size="13.5" xml:space="preserve">Данные: ок</text>
<text x="236.0" y="85.5" fill="#e54c4c" opacity="1.000" font-size="13.5" xml:space="preserve">О скрипте</text>
<text x="228.0" y="117.5" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">SFN Helper</text>
<text x="228.0" y="149.5" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">версия 0.3.1   San Fierro News</text>
<text x="228.0" y="197.5" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">Что делает скрипт</text>
<text x="228.0" y="221.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    Ведёт журнал состава редакции: кто принят, кем и когда, какой ранг,</text>
<text x="228.0" y="245.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    когда повышение уже можно давать. Следит за лимитом должностей</text>
<text x="228.0" y="269.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    старшего состава и минимальными уровнями.</text>
<text x="228.0" y="317.5" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">Откуда берутся сотрудники</text>
<text x="228.0" y="341.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    «Журнал» -&gt; «Состав из /members»: скрипт сам отправляет команду и</text>
<text x="228.0" y="365.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    разбирает ответ сервера (онлайн-состав фракции).</text>
<text x="228.0" y="389.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    «Поиск» -&gt; «+ В состав»: любой игрок по нику, в том числе не в игре.</text>
<text x="228.0" y="413.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    /sfnlogadd Ник [КтоПринял]: добавить стажёра вручную.</text>
<text x="228.0" y="461.5" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">Обновления</text>
<text x="228.0" y="485.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    Скрипт обновляет себя сам: раз в несколько часов смотрит, не появилась</text>
<text x="228.0" y="509.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    ли в репозитории версия новее, и ставит её. Старый файл сохраняется</text>
<text x="228.0" y="533.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    рядом как SFNLogs.lua.bak. После установки нужно ввести /reload или</text>
<text x="228.0" y="557.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    перезапустить игру. Отключается в «Настройках».</text>
<text x="228.0" y="605.5" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">Откуда берутся ранги и даты</text>
<text x="228.0" y="629.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    Из официального журнала Evolve Role Play (https://api.evolvelogs.ru).</text>
<text x="228.0" y="653.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    Скрипт обновляет данные сам, в фоне, и не мешает игре.</text>
<text x="228.0" y="701.5" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">Команды</text>
<text x="228.0" y="725.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    /sfnlog - окно (или клавиша из настроек, по умолчанию F8)</text>
<text x="228.0" y="749.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    /sfnlogmembers - запросить онлайн-состав у сервера</text>
<text x="228.0" y="773.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    /sfnlogadd Ник [КтоПринял] - добавить стажёра</text>
<text x="228.0" y="797.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    /sfnlogsave - сохранить журнал    /sfnlogexport - выгрузить в файл</text>
<text x="228.0" y="821.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    /sfnlogupdate - проверить и поставить обновление</text>
<text x="228.0" y="845.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">    /sfnlogapi и /sfnlogui - диагностика (нужна только при неполадках)</text>
<text x="228.0" y="893.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">Оформление — визуальный язык Evolve Logs (Mary_Norton), воспроизведено</text>
<text x="228.0" y="917.5" fill="#5b6b77" opacity="1.000" font-size="13.5" xml:space="preserve">по исходникам modules/ui.lua с согласия владельцев журнала.</text>
<text x="228.0" y="965.5" fill="#ffffff" opacity="1.000" font-size="13.5" xml:space="preserve">Модули помощника</text>
<text x="228.0" y="989.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    Фото — недельные лимиты фото игроков и мест, метки в заказ-диалоге</text>
<text x="228.0" y="1013.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    Эфир — викторины в эфире: математика, анаграммы, вышибалы; счёт и речи</text>
<text x="228.0" y="1037.5" fill="#999999" opacity="1.000" font-size="13.5" xml:space="preserve">    Соцопрос — социальный опрос игроков и раздача листовок: цикл, скринш...</text>
</svg>