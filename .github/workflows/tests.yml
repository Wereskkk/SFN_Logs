name: tests

# Регресс-тесты на каждый push и pull request.
#
# Смысл: автообновление (2.2.0) подменяет файл скрипта у каждого игрока
# автоматически, поэтому красная ветка main — это не «неудобно», а поломка
# у всех пользователей сразу. Прогон обязателен до вливания.
#
# Наборы (счётчики сверяются с README.md, раздел «Проверка»):
#   logic  554 — бизнес-логика: правила повышений, JSON, кодировки, разбор
#                /members, версии обновления, saveConfig;
#   ui     272 — вёрстка на headless-моке mimgui: наложения текста, выход за
#                границы окна, баланс Begin/End и Push/Pop, DPI, fallback;
#   api    149 — сетевой слой: статусы 6/58, гонка «статус раньше тела»,
#                тишина, 404 NOT_FOUND, повторы и откат, автообновление;
#   strict     — отдельная проверка, что DrawList жив и окно не деградировало
#                в текстовый режим (цвета и примитивы реально вызываются);
#   helper 853 — логика ядра и модулей SFN_Helper (Фото, Эфир, Соцопрос,
#                общая база полов) и 192 проверки вёрстки его вкладок;
#   lua51      — игровой слой обязан компилироваться парсером Lua 5.1:
#                MoonLoader работает на LuaJIT (5.1), а lupa — на Lua 5.4+,
#                операторы & | ~ << >> // в 5.1 не существуют (регресс
#                helper 0.3.0: bit-шим на операторах 5.3 уронил загрузку
#                скрипта в игре). Там же фазз bit-шима и SHA-256 на
#                настоящем интерпретаторе 5.1 против семантики LuaJIT.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: delivery/proekt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Зависимости (lupa = Lua 5.4 внутри Python)
        run: |
          python -m pip install --upgrade pip
          pip install lupa

      - name: Lua 5.1 для проверки синтаксиса LuaJIT (сборка из исходников)
        run: |
          curl -sSL -o /tmp/lua-5.1.5.tar.gz https://www.lua.org/ftp/lua-5.1.5.tar.gz
          echo "2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333  /tmp/lua-5.1.5.tar.gz" | sha256sum -c -
          tar xzf /tmp/lua-5.1.5.tar.gz -C /tmp
          cd /tmp/lua-5.1.5/src
          CORE="lapi.c lcode.c ldebug.c ldo.c ldump.c lfunc.c lgc.c llex.c lmem.c lobject.c lopcodes.c lparser.c lstate.c lstring.c ltable.c ltm.c lundump.c lvm.c lzio.c lauxlib.c lbaselib.c ldblib.c liolib.c lmathlib.c loslib.c ltablib.c lstrlib.c loadlib.c linit.c"
          gcc -O1 -w -o luac5.1 luac.c print.c $CORE -lm
          gcc -O1 -w -o lua5.1 lua.c $CORE -lm
          ./luac5.1 -v
          echo "LUAC51=/tmp/lua-5.1.5/src/luac5.1" >> "$GITHUB_ENV"
          echo "LUA51=/tmp/lua-5.1.5/src/lua5.1" >> "$GITHUB_ENV"
        working-directory: .

      - name: "Lua 5.1: синтаксис игровых файлов для LuaJIT + фазз bit-шима"
        run: python tests/run_lua51_syntax.py

      - name: Синтаксис всех копий SFNLogs.lua и SFN_Helper.lua
        run: |
          python - <<'PY'
          import io, sys
          import lupa
          L = lupa.LuaRuntime()
          paths = ["SFNLogs.lua",
                   "delivery/SFNLogs.lua",
                   "delivery/proekt/SFNLogs.lua",
                   "delivery/moonloader_pack/SFNLogs.lua",
                   "SFN_Helper.lua"]
          bad = 0
          for p in paths:
              src = io.open(p, encoding="utf-8").read()
              res = L.eval("function(s) local c,e = load(s,'x') return c and 'OK' or tostring(e) end")(src)
              print(f"{res:4s}  {p}")
              if res != "OK":
                  bad += 1
          sys.exit(1 if bad else 0)
          PY
        working-directory: .

      - name: Копии SFNLogs.lua не разъехались
        run: python delivery/proekt/tools/sync_delivery.py --check
        working-directory: .

      - name: Бизнес-логика (test_logic.lua)
        run: python tests/run_logic.py

      - name: Вёрстка окна (test_ui.lua)
        run: python tests/run_ui.py

      - name: Строгая проверка цветов и DrawList
        run: python tests/run_ui_strict_colors.py

      - name: Сетевой слой и автообновление (tests/test_api.lua)
        run: python tests/run_api.py

      - name: "Helper: логика ядра и модулей (Фото, Эфир, Соцопрос)"
        run: python tests/run_helper_logic.py

      - name: "Helper: вёрстка вкладок"
        run: python tests/run_helper_ui.py

      - name: Превью разделов собираются без ошибок раскладки
        run: python tests/render_svg.py

      - name: "Превью вкладок SFN_Helper (все модули)"
        run: python tests/render_helper_svg.py
